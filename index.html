
<!DOCTYPE html>
<html>
<head>
    <title>My First Website</title>

    <style>
        body {
            background: linear-gradient(135deg, #667eea, #764ba2);
            font-family: sans-serif;
            text-align: center;
            padding: 40px 15px;
            margin: 0;
            min-height: 100vh;
            box-sizing: border-box;
        }

        h1 {
            color: white;
            font-size: 32px;
        }

        h2 {
            color: white;
        }

        p {
            color: white;
            font-size: 18px;
        }

        button {
            background: white;
            color: purple;
            border: none;
            padding: 14px 30px;
            border-radius: 30px;
            font-size: 17px;
        }
    </style>
</head>

<body>
    <h1>नमस्ते संसार!</h1>

    <h2>मेरो पहिलो Website</h2>

    <p>म GitHub प्रयोग गरेर Coding सिक्दै छु।</p>
    
<button onclick="showMessage()">Click Me</button>

<p id="message"></p>

<script>
function showMessage() {
    document.getElementById("message").innerText =
    "नमस्ते! मेरो वेबसाइटमा स्वागत छ। 😊";
}
</script>
</body>
</html>
